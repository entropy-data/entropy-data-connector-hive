entropydata.client.host=https://api.entropy-data.com
entropydata.client.apikey=your-api-key

# Hive-compatible connection settings (supports Hive, Impala, Cloudera Hive/Impala)
entropydata.client.hive.connection.host=localhost
entropydata.client.hive.connection.port=10000
entropydata.client.hive.connection.database=default
entropydata.client.hive.connection.username=your-username
entropydata.client.hive.connection.password=your-password
# JDBC driver class - examples: org.apache.hive.jdbc.HiveDriver, com.cloudera.hive.jdbc.HS2Driver, com.cloudera.impala.jdbc.Driver
entropydata.client.hive.connection.driver-class-name=org.apache.hive.jdbc.HiveDriver
# JDBC URL - examples: jdbc:hive2://host:port/db, jdbc:impala://host:port/db
entropydata.client.hive.connection.jdbc-url=jdbc:hive2://localhost:10000/default

entropydata.client.hive.assets.connectorid=hive-assets
entropydata.client.hive.assets.enabled=true
entropydata.client.hive.assets.pollinterval=PT10M
entropydata.client.hive.assets.detailed-table-info=json
entropydata.client.hive.assets.id-prefix=hive
# Owner team ID for all assets - must be a valid team ID in Entropy Data (leave empty for no owner)
entropydata.client.hive.assets.owner=

# The synchronization health is reported as a component of the health endpoint, which is only rendered with details enabled
management.endpoint.health.show-details=always
# DEGRADED ranks above UP, so that it shows in the aggregated status. It is not mapped to an error response, because
# restarting the container does not fix an unavailable data platform.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
